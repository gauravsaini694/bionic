<svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aboutTitle">
  <title id="aboutTitle">Illustration of a person taking a confident step forward</title>
  <defs>
    <linearGradient id="aboutBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0F0F0"/>
      <stop offset="1" stop-color="#F0F0F0"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#aboutBg)"/>
  <circle cx="350" cy="350" r="230" fill="#25318D" opacity="0.05"/>

  <!-- motion arcs -->
  <path d="M130 560 Q220 520 310 560" stroke="#D9D9D9" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M110 590 Q210 545 320 590" stroke="#D9D9D9" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- figure mid-stride -->
  <g transform="translate(260,190)">
    <circle cx="80" cy="34" r="38" fill="#25318D"/>
    <path d="M30 100 Q80 78 130 100 L150 260 Q80 290 10 260 Z" fill="#25318D"/>
    <rect x="18" y="150" width="22" height="150" rx="11" fill="#000000" transform="rotate(-10 18 150)"/>
    <rect x="112" y="150" width="22" height="150" rx="11" fill="#93C251" transform="rotate(18 112 150)"/>
    <path d="M20 110 L-40 150 L-30 175 L35 135 Z" fill="#25318D"/>
    <path d="M140 110 L200 90 L208 115 L148 135 Z" fill="#25318D"/>
    <circle cx="205" cy="98" r="12" fill="#F2C9A0"/>
    <circle cx="-42" cy="158" r="12" fill="#F2C9A0"/>
  </g>

  <!-- accent stars -->
  <circle cx="540" cy="180" r="6" fill="#93C251" opacity="0.7"/>
  <circle cx="565" cy="210" r="4" fill="#93C251" opacity="0.7"/>
  <circle cx="150" cy="150" r="5" fill="#25318D" opacity="0.6"/>
</svg>
