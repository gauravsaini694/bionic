<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Illustration of a clinician and patient walking forward together</title>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F4F4"/>
      <stop offset="1" stop-color="#F0F0F0"/>
    </linearGradient>
    <linearGradient id="heroBlob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25318D"/>
      <stop offset="1" stop-color="#25318D"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#heroBg)"/>
  <circle cx="640" cy="120" r="220" fill="url(#heroBlob)" opacity="0.08"/>
  <circle cx="120" cy="500" r="160" fill="#93C251" opacity="0.08"/>

  <!-- motion arcs -->
  <path d="M80 430 Q140 400 200 430" stroke="#E0E0E0" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M60 460 Q130 425 210 460" stroke="#E0E0E0" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- ground line -->
  <line x1="60" y1="520" x2="740" y2="520" stroke="#E9E9E9" stroke-width="2"/>

  <!-- clinician figure -->
  <g transform="translate(300,150)">
    <circle cx="60" cy="30" r="34" fill="#25318D"/>
    <path d="M20 90 Q60 70 100 90 L108 260 Q60 280 12 260 Z" fill="#25318D"/>
    <rect x="14" y="120" width="18" height="130" rx="9" fill="#000000"/>
    <rect x="88" y="120" width="18" height="130" rx="9" fill="#000000"/>
    <path d="M100 140 L150 110 L160 130 L112 165 Z" fill="#25318D"/>
    <circle cx="158" cy="122" r="10" fill="#F2C9A0"/>
  </g>

  <!-- patient figure with prosthetic leg -->
  <g transform="translate(430,180)">
    <circle cx="50" cy="26" r="28" fill="#93C251"/>
    <path d="M18 76 Q50 58 82 76 L88 220 Q50 236 12 220 Z" fill="#93C251"/>
    <rect x="16" y="102" width="16" height="100" rx="8" fill="#000000"/>
    <rect x="70" y="102" width="14" height="60" rx="7" fill="#000000"/>
    <line x1="77" y1="160" x2="77" y2="230" stroke="#8C8C8C" stroke-width="8" stroke-linecap="round"/>
    <circle cx="77" cy="160" r="9" fill="#000000"/>
    <path d="M40 40 L70 30 L78 46 L46 58 Z" fill="#93C251"/>
    <circle cx="76" cy="40" r="9" fill="#F2C9A0"/>
  </g>

  <!-- badge accent dots -->
  <circle cx="700" cy="480" r="6" fill="#93C251" opacity="0.6"/>
  <circle cx="680" cy="500" r="4" fill="#25318D" opacity="0.6"/>
  <circle cx="720" cy="510" r="5" fill="#93C251" opacity="0.6"/>
</svg>
