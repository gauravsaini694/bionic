<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapTitle">
  <title id="mapTitle">Illustration of a clinic locator map with pins across states</title>
  <rect width="700" height="400" fill="#F4F4F4"/>
  <g fill="#E9EEF9">
    <path d="M60 260 L120 150 L200 140 L260 180 L320 160 L400 170 L460 130 L560 150 L620 220 L600 300 L500 320 L420 300 L340 320 L260 300 L180 320 L100 300 Z"/>
  </g>
  <g stroke="#E0E0E0" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="150" y1="150" x2="150" y2="310"/>
    <line x1="260" y1="150" x2="260" y2="310"/>
    <line x1="370" y1="150" x2="370" y2="310"/>
    <line x1="480" y1="150" x2="480" y2="310"/>
    <line x1="90" y1="200" x2="600" y2="200"/>
    <line x1="90" y1="250" x2="600" y2="250"/>
  </g>
  <!-- pins -->
  <g fill="#25318D">
    <circle cx="180" cy="200" r="8"/>
    <circle cx="260" cy="230" r="8"/>
    <circle cx="330" cy="190" r="8"/>
    <circle cx="400" cy="240" r="8"/>
    <circle cx="460" cy="200" r="8"/>
  </g>
  <g fill="#93C251">
    <circle cx="220" cy="270" r="9"/>
    <circle cx="500" cy="260" r="9"/>
  </g>
</svg>
