<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="testiTitle">
  <title id="testiTitle">Illustration of two patients celebrating with a fist bump</title>
  <defs>
    <linearGradient id="testiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF3DC"/>
      <stop offset="1" stop-color="#F4F4F4"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#testiBg)"/>

  <!-- confetti -->
  <g>
    <circle cx="120" cy="90" r="6" fill="#93C251"/>
    <circle cx="760" cy="110" r="6" fill="#25318D"/>
    <circle cx="200" cy="400" r="5" fill="#25318D"/>
    <circle cx="700" cy="380" r="5" fill="#93C251"/>
    <rect x="820" y="160" width="10" height="10" fill="#93C251" transform="rotate(20 825 165)"/>
    <rect x="70" y="260" width="10" height="10" fill="#93C251" transform="rotate(-15 75 265)"/>
  </g>

  <!-- left person arm -->
  <g transform="translate(300,220)">
    <circle cx="0" cy="0" r="36" fill="#25318D"/>
    <path d="M-60 40 Q-20 10 40 20 L60 60 L30 90 Q-20 70 -70 90 Z" fill="#25318D"/>
    <rect x="20" y="10" width="130" height="34" rx="17" fill="#F2C9A0" transform="rotate(-8 20 10)"/>
    <circle cx="150" cy="0" r="24" fill="#F2C9A0"/>
  </g>

  <!-- right person arm -->
  <g transform="translate(600,220)">
    <circle cx="0" cy="0" r="36" fill="#93C251"/>
    <path d="M60 40 Q20 10 -40 20 L-60 60 L-30 90 Q20 70 70 90 Z" fill="#93C251"/>
    <rect x="-150" y="10" width="130" height="34" rx="17" fill="#D89A67" transform="rotate(8 -150 10)"/>
    <circle cx="-150" cy="0" r="24" fill="#D89A67"/>
  </g>

  <!-- impact burst -->
  <g stroke="#93C251" stroke-width="5" stroke-linecap="round">
    <line x1="450" y1="180" x2="450" y2="150"/>
    <line x1="480" y1="195" x2="505" y2="170"/>
    <line x1="420" y1="195" x2="395" y2="170"/>
  </g>
</svg>
