{{- /* Breadcrumb + eyebrow + H1 + subhead. Context: page. */ -}}
{{- partial "heroes/parts/crumbs.html" . -}}
{{- with .Params.eyebrow }}<span class="eyebrow hx-eyebrow">{{ . }}</span>{{ end }}
<h1 class="hx-title">{{ partial "heroes/parts/title.html" . }}</h1>
{{- with (.Params.subhead | default .Description) }}<p class="hx-sub">{{ . | markdownify }}</p>{{ end -}}
