{{- if not .IsHome -}}
<nav class="crumbs hx-crumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ "/" | relURL }}">Home</a></li>
    {{- range .Ancestors.Reverse }}{{ if not .IsHome }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}{{ end }}
    <li><span aria-current="page">{{ .LinkTitle }}</span></li>
  </ol>
</nav>
{{- end -}}
