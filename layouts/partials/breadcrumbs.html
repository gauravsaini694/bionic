{{- /* Shared breadcrumbs. Context: dict "page" <page> ["light" true for dark banners] */ -}}
{{- $pg := .page -}}
<nav class="crumbs{{ if .light }} crumbs-light{{ end }}" aria-label="Breadcrumb">
  <ol>
    <li><a href="/">Home</a></li>
    {{ range $pg.Ancestors.Reverse }}{{ if not .IsHome }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}{{ end }}
    <li><span aria-current="page">{{ $pg.Params.name | default $pg.Title }}</span></li>
  </ol>
</nav>
