baseURL = "https://www.bionicpo.com/"
locale = "en-us"
enableRobotsTXT = true
title = "Bionic Prosthetics & Orthotics"

[module]
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  [[module.mounts]]
    source = "static/css"
    target = "assets/css"
  [[module.mounts]]
    source = "static/js"
    target = "assets/js"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"

[taxonomies]
  category = "categories"

[params]
  gtmID = "GTM-5WTFB2L2"
  googleAdsIDs = ["AW-677614629", "AW-849212221"]
  brandColor = "#1D3F96"
  accentColor = "#F2994A"
  # Google Apps Script Web App URL (ends with /exec) for the /contact/ form. Empty = demo mode.
  # Apps Script /exec URL for the blog-post lead form and the Grow application form (empty = form shows "not configured")
  blog_form_endpoint = "https://script.google.com/macros/s/AKfycbzi7W_p5p3s9mdAxAvZ5zfvi4SrtuwfYvRJlSwILaZBXeYFWXhhPSv5jHMPDTW1nGfn/exec"
  grow_form_endpoint = "https://script.google.com/macros/s/AKfycbzi7W_p5p3s9mdAxAvZ5zfvi4SrtuwfYvRJlSwILaZBXeYFWXhhPSv5jHMPDTW1nGfn/exec"
  contactFormEndpoint = "https://script.google.com/macros/s/AKfycbzi7W_p5p3s9mdAxAvZ5zfvi4SrtuwfYvRJlSwILaZBXeYFWXhhPSv5jHMPDTW1nGfn/exec"

[params.contactPoint]
  contactType = "customer service"
  areaServed = "US"
  availableLanguage = "English"

[permalinks]
  [permalinks.taxonomy]
    categories = "/blog/categories/"
  [permalinks.term]
    categories = "/blog/categories/:slug/"

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
