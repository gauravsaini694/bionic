    name: address
    widget: string
    hint: 'Put the 5-digit ZIP at the end. Example: 9921 Pines Blvd, Pembroke Pines, FL 33024'
    required: true
  - label: Latitude
    name: lat
    widget: number
    hint: Needed for the map pin and nearby search. Find it on openstreetmap.org (right-click → Show address).
    required: false
    value_type: float
  - label: Longitude
    name: lng
    widget: number
    required: false
