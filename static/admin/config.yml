# Decap CMS configuration (edit by hand). Login: Netlify Identity + Git Gateway (see README).
# Local testing: run `npx decap-server` + `hugo server`, then open http://localhost:1313/admin/.
# Folder collections (blog, clinical team, executive team, clinics) only list files that carry the hidden
# `entry_type` marker, so section pages (_index.md) never show up as entries. New entries get it automatically.
backend:
  name: git-gateway
  branch: main
local_backend: true
site_url: https://www.bionicpo.com
display_url: https://www.bionicpo.com
logo_url: /images/Bionic-logo.avif
media_folder: static/images/uploads
public_folder: /images/uploads
publish_mode: simple
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: home
  label: Home page
  files:
  - name: content_index_md
    label: Home page
    file: content/_index.md
    fields:
    - label: Page title
      name: title
      widget: string
      hint: Used in the browser tab, menus and breadcrumbs.
      required: true
    - label: Short description
      name: description
      widget: text
      required: false
    - label: Page image
      name: image
      widget: image
      hint: Used for social sharing and as the default section image.
      required: false
    - &id002
      label: SEO title
      name: seo_title
      widget: string
      hint: Overrides the browser tab / Google title. Leave empty to use the page title.
      required: false
    - &id003
      label: SEO description
      name: seo_description
      widget: text
      hint: Shown by Google under the title (about 150 characters).
      required: false
    - label: 1. Top banner (hero)
      name: hero
      widget: object
      fields:
      - label: Small badge text
        name: eyebrow
        widget: string
        required: false
      - label: Headline (first part)
        name: headline_start
        widget: string
        required: false
      - label: Headline (highlighted, blue italic)
        name: headline_highlight
        widget: string
        required: false
      - label: Intro text
        name: subhead
        widget: text
        required: false
      - label: Green button text
        name: cta_primary
        widget: string
        required: false
      - label: Green button link
        name: cta_primary_link
        widget: string
        required: false
      - label: White button text
        name: cta_secondary
        widget: string
        required: false
      - label: White button link
        name: cta_secondary_link
        widget: string
        required: false
      - label: Hero image
        name: image
        widget: image
        required: false
      - label: Hero image description
        name: image_alt
        widget: string
        required: false
      - label: Image badge title
        name: badge_title
        widget: string
        required: false
      - label: Image badge text
        name: badge_text
        widget: string
        required: false
      - label: Quick link pills
        name: quick_links
        widget: list
        required: false
        fields:
        - label: Label
          name: label
          widget: string
          required: false
        - label: Link
          name: link
          widget: string
          required: false
        - label: Icon
          name: icon
          widget: select
          hint: Small icon shown on the card.
          required: false
          options: &id001
          - award
          - card
          - certified
          - check
          - diabetic
          - insurance
          - location
          - map
          - orthotic
          - pediatric
          - people
          - personalized
          - phone
          - photo
          - pin
          - prosthetic
          - star
          - technology
        summary: '{{fields.label}}'
      collapsed: true
      required: false
    - label: 2. Numbers band (2007, 12 States…)
      name: stats
      widget: list
      required: false
      fields:
      - label: Number / value
        name: number
        widget: string
        required: true
      - label: Label
        name: label
        widget: string
        required: false
      summary: '{{fields.number}} — {{fields.label}}'
