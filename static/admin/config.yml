- name: blog
  filter:
    field: entry_type
    value: blog_post
  label: Blog posts
  label_singular: Blog post
  folder: content/resources/blog
  create: true
  delete: true
  extension: md
  format: yaml-frontmatter
  slug: '{{slug}}'
  path: '{{slug}}/index'
  nested:
    depth: 2
    summary: '{{title}}'
  meta:
    path:
      widget: string
      label: Post address
      index_file: index
  sortable_fields:
  - date
  - title
  summary: '{{title}} — {{date}}'
  view_filters:
  - label: Drafts
    field: draft
    pattern: true
  description: Create, edit or delete blog posts. Draft posts are not published.
  fields:
  - label: Title
    name: title
    widget: string
    required: true
  - label: Publish date
    name: date
    widget: datetime
    hint: Posts dated in the future stay hidden until that day.
    required: true
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
    picker_utc: false
  - label: Draft (hide from the website)
    name: draft
    widget: boolean
    hint: Turn ON to keep the post unpublished.
    required: false
    default: false
  - label: Category
    name: categories
    widget: list
    required: false
    hint: 'Use one: Prosthetics and Orthotics, Health and Wellness or Success Stories. The first one is used for the blog filter.'
    field:
      label: Category
      name: item
      widget: string
  - label: Featured image
    name: image
    widget: image
    required: false
  - label: Featured image description (for accessibility)
    name: image_alt
    widget: string
    required: false
  - label: Author
    name: author
    widget: string
    hint: Leave empty to use the default author.
    required: false
  - label: Short summary
    name: description
    widget: text
    hint: Shown on blog cards and used as the SEO description.
    required: false
  - label: SEO title
    name: seo_title
    widget: string
    hint: Overrides the browser/Google title.
    required: false
  - label: FAQ (adds Google FAQ markup)
    name: faq
    widget: list
    required: false
    fields:
    - label: Question
      name: question
      widget: string
      required: true
    - label: Answer
      name: answer
      widget: text
      hint: Must match the FAQ text in the post body.
      required: false
    summary: '{{fields.question}}'
  - label: entry_type
    name: entry_type
    widget: hidden
    default: blog_post
    required: false
  - label: Post text
    name: body
    widget: markdown
    required: false
