<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clinicalTitle">
  <title id="clinicalTitle">Illustration of a certified clinician reviewing a care plan</title>
  <defs>
    <linearGradient id="clinBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9EEF9"/>
      <stop offset="1" stop-color="#DCE4F5"/>
    </linearGradient>
  </defs>
  <rect width="700" height="500" fill="url(#clinBg)"/>
  <circle cx="580" cy="80" r="140" fill="#25318D" opacity="0.06"/>

  <!-- desk -->
  <rect x="80" y="380" width="540" height="14" rx="7" fill="#E0E0E0"/>

  <!-- clinician -->
  <g transform="translate(230,120)">
    <circle cx="70" cy="34" r="36" fill="#F2C9A0"/>
    <path d="M20 96 Q70 74 120 96 L128 260 Q70 282 12 260 Z" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="3"/>
    <path d="M55 96 L70 130 L85 96" fill="none" stroke="#25318D" stroke-width="6" stroke-linecap="round"/>
    <rect x="60" y="66" width="20" height="30" fill="#F2C9A0"/>
    <circle cx="70" cy="26" r="4" fill="#25318D"/>
  </g>

  <!-- clipboard -->
  <g transform="translate(380,190)">
    <rect x="0" y="0" width="120" height="150" rx="10" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="3"/>
    <rect x="30" y="-10" width="60" height="20" rx="6" fill="#25318D"/>
    <line x1="20" y1="40" x2="100" y2="40" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="65" x2="100" y2="65" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <line x1="20" y1="90" x2="70" y2="90" stroke="#E0E0E0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="30" cy="120" r="10" fill="#93C251"/>
    <path d="M25 120 l4 5 l8 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- cross badge -->
  <g transform="translate(120,220)">
    <circle cx="0" cy="0" r="34" fill="#EAF3DC"/>
    <rect x="-4" y="-16" width="8" height="32" rx="3" fill="#000000"/>
    <rect x="-16" y="-4" width="32" height="8" rx="3" fill="#000000"/>
  </g>
</svg>
