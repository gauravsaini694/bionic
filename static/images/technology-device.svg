<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="techTitle">
  <title id="techTitle">Illustration of bionic prosthetic technology</title>
  <defs>
    <linearGradient id="techBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <rect width="700" height="500" fill="url(#techBg)"/>

  <!-- circuit lines -->
  <g stroke="#25318D" stroke-width="2" fill="none" opacity="0.6">
    <path d="M60 90 H220 V150 H340"/>
    <path d="M60 410 H180 V350 H300"/>
    <path d="M640 100 H500 V170 H400"/>
    <path d="M640 400 H520 V330 H420"/>
  </g>
  <circle cx="60" cy="90" r="5" fill="#93C251"/>
  <circle cx="340" cy="150" r="5" fill="#93C251"/>
  <circle cx="60" cy="410" r="5" fill="#93C251"/>
  <circle cx="300" cy="350" r="5" fill="#93C251"/>
  <circle cx="640" cy="100" r="5" fill="#93C251"/>
  <circle cx="400" cy="170" r="5" fill="#93C251"/>
  <circle cx="640" cy="400" r="5" fill="#93C251"/>
  <circle cx="420" cy="330" r="5" fill="#93C251"/>

  <!-- bionic leg silhouette -->
  <g transform="translate(280,110)">
    <path d="M40 0 h60 v80 q0 20 -12 30 l-10 20 h-16 l-10 -20 q-12 -10 -12 -30 z" fill="#93C251" opacity="0.9"/>
    <rect x="55" y="130" width="30" height="90" rx="8" fill="#93C251" opacity="0.55"/>
    <circle cx="70" cy="230" r="16" fill="#93C251"/>
    <rect x="58" y="246" width="24" height="70" rx="10" fill="#93C251" opacity="0.55"/>
    <path d="M50 316 h40 l10 20 h-60 z" fill="#93C251"/>
  </g>
</svg>
