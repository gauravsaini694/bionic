  title: About Us
  text: Bionic Prosthetics and Orthotics is an organization aimed at providing the very best in prosthetic and orthotic care in orthopedic rehabilitation. Bionic Prosthetics and Orthotics was founded with the vision of creating a Prosthetic and Orthotic practice that treats every patient with dignity and first-rate care. We evaluate every patient in detail and design a prosthetic / orthotic rehabilitation program to specifically cater to their needs and demands.
